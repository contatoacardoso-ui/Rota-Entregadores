<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Gestão de Rotas</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
        .container { width: 100%; max-width: 540px; }
        header { text-align: center; margin-bottom: 16px; }
        header h1 { font-size: 1.35rem; }

        /* Navegação por Abas */
        .tabs {
            display: flex;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 18px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 11px 8px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.ativa {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.35);
        }
        .tab-badge {
            font-size: 0.72rem;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: inherit;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.18s ease;
        }
        .tab-content.ativa {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: #0f172a; color: var(--text); font-size: 0.95rem; outline: none;
        }
        input.upper { text-transform: uppercase; }
        input.upper::placeholder { text-transform: none; }
        input:focus { border-color: var(--primary); }
        .btn-row { display: flex; gap: 10px; margin-top: 14px; }
        button.action-btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600;
            font-size: 0.95rem; cursor: pointer; transition: 0.2s; color: #fff;
        }
        .btn-save { background: var(--primary); }
        .btn-cancel { background: var(--border); display: none; }
        .feedback-msg {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }
        
        /* Card Expansível (Accordion) por Entregador */
        .entregador-group {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s;
        }
        .entregador-group.aberto {
            border-color: var(--primary);
        }
        .entregador-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; cursor: pointer; user-select: none;
            transition: background-color 0.15s;
        }
        .entregador-header:active {
            background-color: rgba(255, 255, 255, 0.04);
        }
        .entregador-title-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .entregador-header h3 { font-size: 0.98rem; color: var(--text); font-weight: 700; }
        .entregador-group.aberto .entregador-header h3 { color: var(--primary); }
        .entregador-meta {
            display: flex; align-items: center; gap: 10px;
        }
        .entregador-count {
            font-size: 0.75rem; background: rgba(59, 130, 246, 0.15); color: var(--primary);
            padding: 3px 8px; border-radius: 12px; font-weight: 600;
        }
        .chevron {
            font-size: 0.8rem; color: var(--muted); transition: transform 0.2s ease;
        }
        .entregador-group.aberto .chevron {
            transform: rotate(180deg); color: var(--primary);
        }
        .entregador-body {
            display: none;
            padding: 0 16px 12px 16px;
            border-top: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.35);
        }
        .entregador-group.aberto .entregador-body {
            display: block;
            animation: slideDown 0.18s ease;
        }

        /* Barra de ações globais do entregador (Renomear / Excluir tudo) */
        .entregador-bulk-actions {
            display: flex;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .btn-bulk {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 7px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-rename-ent {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border-color: rgba(59, 130, 246, 0.35);
        }
        .btn-del-ent {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.35);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .rua-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding: 10px 0; border-bottom: 1px dashed #2d3b4e;
        }
        .rua-row:last-child { border-bottom: none; padding-bottom: 4px; }
        .rua-details { flex: 1; }
        .rua-details p { font-size: 0.88rem; font-weight: 600; color: var(--text); }
        .rua-details span { font-size: 0.76rem; color: var(--success); display: block; margin-top: 2px; font-weight: 600; }
        .item-actions { display: flex; gap: 6px; }
        .btn-sm { padding: 6px 10px; font-size: 0.76rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-edit { background: var(--warning); color: #000; }
        .btn-del { background: var(--danger); color: #fff; }
        #loginScreen { margin-top: 60px; text-align: center; }
        #appScreen { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Tela de Bloqueio Simples -->
    <div id="loginScreen" class="box">
        <h2 style="margin-bottom: 12px; font-size: 1.2rem;">Acesso Administrativo</h2>
        <div class="form-group">
            <input type="password" id="pinInput" inputmode="numeric" placeholder="Digite o PIN de acesso">
        </div>
        <button class="action-btn btn-save" onclick="verificarPin()" style="width: 100%;">Entrar</button>
    </div>

    <!-- Tela Principal Admin -->
    <div id="appScreen">
        <header>
            <h1>Painel de Rotas</h1>
        </header>

        <!-- Barra de Abas -->
        <div class="tabs">
            <button class="tab-btn ativa" id="btnTabCadastro" onclick="trocarAba('cadastro')">
                ➕ Cadastro
            </button>
            <button class="tab-btn" id="btnTabLista" onclick="trocarAba('lista')">
                🚚 Entregadores <span class="tab-badge" id="badgeTotalEntregadores">0</span>
            </button>
        </div>

        <!-- ABA 1: SOMENTE CADASTRO / EDIÇÃO -->
        <div id="abaCadastro" class="tab-content ativa">
            <div class="box">
                <h2 id="formTitle" style="font-size: 1rem; margin-bottom: 12px; color: var(--primary);">Novo Cadastro</h2>
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label>Nome do Entregador *</label>
                    <input type="text" id="entregador" class="upper" placeholder="Ex: CARLOS SILVA" list="listaEntregadores">
                    <datalist id="listaEntregadores"></datalist>
                </div>

                <div class="form-group">
                    <label>Nome da Rua / Avenida *</label>
                    <input type="text" id="rua" class="upper" placeholder="Ex: RUA DAS ACÁCIAS" list="listaRuas">
                    <datalist id="listaRuas"></datalist>
                </div>

                <div class="form-group">
                    <label>Numeração Atendida (Deixe vazio para "TODA A RUA")</label>
                    <input type="text" id="numeracao" class="upper" placeholder="Ex: 100 AO 450 | ou | 12, 34, 90">
                </div>

                <div class="btn-row">
                    <button class="action-btn btn-save" id="btnSalvar" onclick="salvarRegistro()">Salvar Cadastro</button>
                    <button class="action-btn btn-cancel" id="btnCancelar" onclick="cancelarEdicao()">Cancelar</button>
                </div>

                <div id="feedbackMsg" class="feedback-msg"></div>
            </div>
        </div>

        <!-- ABA 2: ENTREGADORES E ROTAS CADASTRADAS -->
        <div id="abaLista" class="tab-content">
            <div class="form-group">
                <input type="text" id="filtroAdmin" class="upper" placeholder="🔍 Filtrar por entregador ou rua..." oninput="aoFiltrar()">
            </div>

            <div id="listaRegistros"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const SENHA_ADMIN = "1234";

    function verificarPin() {
        const pin = document.getElementById('pinInput').value;
        if (pin === SENHA_ADMIN) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            sessionStorage.setItem('adminLogado', 'true');
        } else {
            alert("PIN incorreto!");
        }
    }

    if (sessionStorage.getItem('adminLogado') === 'true') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
    }

    function trocarAba(aba) {
        document.getElementById('btnTabCadastro').classList.remove('ativa');
        document.getElementById('btnTabLista').classList.remove('ativa');
        document.getElementById('abaCadastro').classList.remove('ativa');
        document.getElementById('abaLista').classList.remove('ativa');

        if (aba === 'cadastro') {
            document.getElementById('btnTabCadastro').classList.add('ativa');
            document.getElementById('abaCadastro').classList.add('ativa');
        } else {
            document.getElementById('btnTabLista').classList.add('ativa');
            document.getElementById('abaLista').classList.add('ativa');
            renderizarLista();
        }
    }

    function mostrarFeedback(texto) {
        const el = document.getElementById('feedbackMsg');
        el.innerText = texto;
        el.style.display = 'block';
        setTimeout(() => {
            el.style.display = 'none';
        }, 2500);
    }

    document.querySelectorAll('input.upper').forEach(input => {
        input.addEventListener('input', function() {
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.toUpperCase();
            this.setSelectionRange(start, end);
        });
    });

    const firebaseConfig = {
        apiKey: "AIzaSyC1hLk6k1E138ffdJT9oMBgRh6di4PR2EY",
        authDomain: "rota-entregadores.firebaseapp.com",
        databaseURL: "https://rota-entregadores-default-rtdb.firebaseio.com",
        projectId: "rota-entregadores",
        storageBucket: "rota-entregadores.firebasestorage.app",
        messagingSenderId: "1094577907467",
        appId: "1:1094577907467:web:8472471b28b1ffa459640e",
        measurementId: "G-V71JKBYEZY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const rotasRef = db.ref('rotas');

    let registros = [];
    let entregadorAberto = null;

    rotasRef.on('value', (snapshot) => {
        registros = [];
        const data = snapshot.val();
        const entregadoresUnicos = new Set();
        const ruasUnicas = new Set();

        if (data) {
            Object.keys(data).forEach(id => {
                const item = {
                    id,
                    entregador: (data[id].entregador || "").toUpperCase().trim(),
                    rua: (data[id].rua || "").toUpperCase().trim(),
                    numeracao: (data[id].numeracao || "TODA A RUA").toUpperCase().trim()
                };
                registros.push(item);
                entregadoresUnicos.add(item.entregador);
                ruasUnicas.add(item.rua);
            });
        }

        document.getElementById('badgeTotalEntregadores').innerText = entregadoresUnicos.size;
        document.getElementById('listaEntregadores').innerHTML = [...entregadoresUnicos].sort().map(e => `<option value="${e}">`).join('');
        document.getElementById('listaRuas').innerHTML = [...ruasUnicas].sort().map(r => `<option value="${r}">`).join('');

        renderizarLista();
    });

    function alternarEntregador(nomeEntregador) {
        if (entregadorAberto === nomeEntregador) {
            entregadorAberto = null;
        } else {
            entregadorAberto = nomeEntregador;
        }
        renderizarLista();
    }

    function aoFiltrar() {
        const filtro = document.getElementById('filtroAdmin').value.toUpperCase().trim();
        if (!filtro) {
            entregadorAberto = null;
        }
        renderizarLista(true);
    }

    function salvarRegistro() {
        const id = document.getElementById('editId').value;
        const entregador = document.getElementById('entregador').value.toUpperCase().trim();
        const rua = document.getElementById('rua').value.toUpperCase().trim();
        let numeracao = document.getElementById('numeracao').value.toUpperCase().trim();

        if (!entregador || !rua) {
            alert("PREENCHA O NOME DO ENTREGADOR E O NOME DA RUA.");
            return;
        }

        if (!numeracao) numeracao = "TODA A RUA";

        const payload = { entregador, rua, numeracao };

        if (id) {
            rotasRef.child(id).update(payload).then(() => {
                entregadorAberto = entregador;
                cancelarEdicao();
                trocarAba('lista');
            });
        } else {
            rotasRef.push(payload).then(() => {
                entregadorAberto = entregador;
                document.getElementById('rua').value = '';
                document.getElementById('numeracao').value = '';
                document.getElementById('rua').focus();
                mostrarFeedback(`✓ RUA SALVA PARA ${entregador}`);
            });
        }
    }

    function editarRegistro(id) {
        const item = registros.find(r => r.id === id);
        if (!item) return;

        document.getElementById('editId').value = item.id;
        document.getElementById('entregador').value = item.entregador;
        document.getElementById('rua').value = item.rua;
        document.getElementById('numeracao').value = item.numeracao === "TODA A RUA" ? "" : item.numeracao;

        document.getElementById('formTitle').innerText = "Editando Cadastro";
        document.getElementById('btnSalvar').innerText = "Atualizar";
        document.getElementById('btnCancelar').style.display = "block";

        trocarAba('cadastro');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() {
        const estavaEditando = document.getElementById('editId').value !== '';
        document.getElementById('editId').value = '';
        document.getElementById('entregador').value = '';
        document.getElementById('rua').value = '';
        document.getElementById('numeracao').value = '';

        document.getElementById('formTitle').innerText = "Novo Cadastro";
        document.getElementById('btnSalvar').innerText = "Salvar Cadastro";
        document.getElementById('btnCancelar').style.display = "none";

        if (estavaEditando) {
            trocarAba('lista');
        }
    }

    function excluirRegistro(id, rua, entregador) {
        if (confirm(`REMOVER ${entregador} DA ${rua}?`)) {
            rotasRef.child(id).remove();
        }
    }

    // Renomeia o entregador em todos os registros vinculados a ele no Firebase
    function renomearEntregador(nomeAtual) {
        const entrada = prompt(`DIGITE O NOVO NOME PARA "${nomeAtual}":`, nomeAtual);
        if (entrada === null) return; // Usuário cancelou

        const novoNome = entrada.toUpperCase().trim();
        if (!novoNome) {
            alert("O NOME NÃO PODE FICAR VAZIO.");
            return;
        }
        if (novoNome === nomeAtual) return;

        const itensDoEntregador = registros.filter(r => r.entregador === nomeAtual);
        if (itensDoEntregador.length === 0) return;

        const atualizacoes = {};
        itensDoEntregador.forEach(item => {
            atualizacoes[`${item.id}/entregador`] = novoNome;
        });

        rotasRef.update(atualizacoes).then(() => {
            entregadorAberto = novoNome;
        });
    }

    // Exclui o entregador e todos os seus endereços cadastrados de uma vez
    function excluirEntregadorCompleto(nomeEntregador) {
        const itensDoEntregador = registros.filter(r => r.entregador === nomeEntregador);
        const qtd = itensDoEntregador.length;

        const confirmar = confirm(
            `ATENÇÃO: DESEJA EXCLUIR O ENTREGADOR "${nomeEntregador}" E TODOS OS SEUS ${qtd} ${qtd === 1 ? 'ENDEREÇO CADASTRADO' : 'ENDEREÇOS CADASTRADOS'}?\n\nESSA AÇÃO NÃO PODE SER DESFEITA.`
        );

        if (!confirmar) return;

        const remocoes = {};
        itensDoEntregador.forEach(item => {
            remocoes[item.id] = null;
        });

        rotasRef.update(remocoes).then(() => {
            if (entregadorAberto === nomeEntregador) {
                entregadorAberto = null;
            }
        });
    }

    function renderizarLista(autoExpandirFiltro = false) {
        const filtro = document.getElementById('filtroAdmin').value.toUpperCase().trim();
        const container = document.getElementById('listaRegistros');

        const filtrados = registros.filter(r =>
            r.rua.includes(filtro) ||
            r.entregador.includes(filtro)
        );

        if (filtrados.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:var(--muted); margin-top:24px;">Nenhum registro encontrado.</p>';
            return;
        }

        const agrupadoPorEntregador = {};
        filtrados.forEach(item => {
            if (!agrupadoPorEntregador[item.entregador]) {
                agrupadoPorEntregador[item.entregador] = [];
            }
            agrupadoPorEntregador[item.entregador].push(item);
        });

        const nomesOrdenados = Object.keys(agrupadoPorEntregador).sort((a, b) => a.localeCompare(b));

        if (autoExpandirFiltro && filtro.length > 0 && !nomesOrdenados.includes(entregadorAberto)) {
            entregadorAberto = nomesOrdenados[0];
        }

        container.innerHTML = nomesOrdenados.map(nomeEntregador => {
            const ruasDoEntregador = agrupadoPorEntregador[nomeEntregador].sort((a, b) => a.rua.localeCompare(b.rua));
            const totalRuas = ruasDoEntregador.length;
            const estaAberto = entregadorAberto === nomeEntregador;
            const nomeEscapado = nomeEntregador.replace(/'/g, "\\'");

            const linhasRuas = ruasDoEntregador.map(item => `
                <div class="rua-row">
                    <div class="rua-details">
                        <p>${item.rua}</p>
                        <span>NUMERAÇÃO: ${item.numeracao}</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-sm btn-edit" onclick="editarRegistro('${item.id}')">Editar</button>
                        <button class="btn-sm btn-del" onclick="excluirRegistro('${item.id}', '${item.rua.replace(/'/g, "\\'")}', '${nomeEscapado}')">Excluir</button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="entregador-group ${estaAberto ? 'aberto' : ''}">
                    <div class="entregador-header" onclick="alternarEntregador('${nomeEscapado}')">
                        <div class="entregador-title-wrap">
                            <h3>🚚 ${nomeEntregador}</h3>
                        </div>
                        <div class="entregador-meta">
                            <span class="entregador-count">${totalRuas} ${totalRuas === 1 ? 'RUA' : 'RUAS'}</span>
                            <span class="chevron">▼</span>
                        </div>
                    </div>
                    <div class="entregador-body">
                        <div class="entregador-bulk-actions">
                            <button class="btn-bulk btn-rename-ent" onclick="renomearEntregador('${nomeEscapado}')">✏️ Renomear Entregador</button>
                            <button class="btn-bulk btn-del-ent" onclick="excluirEntregadorCompleto('${nomeEscapado}')">🗑️ Excluir Entregador</button>
                        </div>
                        ${linhasRuas}
                    </div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
