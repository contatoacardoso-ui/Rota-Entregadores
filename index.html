<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consulta de Rotas e Fila de Bipagem</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
            --highlight: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
        .container { width: 100%; max-width: 480px; }
        header { text-align: center; margin-bottom: 16px; padding-top: 8px; }
        header h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); }
        header p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

        /* Navegação por Abas */
        .tabs {
            display: flex;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 11px 8px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.ativa {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.35);
        }
        .tab-badge {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.16);
            color: inherit;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.18s ease;
        }
        .tab-content.ativa {
            display: block;
        }

        .search-box { position: sticky; top: 10px; z-index: 10; background: var(--bg); padding-bottom: 12px; }
        input[type="text"] {
            width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-size: 1rem; outline: none; transition: 0.2s;
            text-transform: uppercase;
        }
        input[type="text"]::placeholder { text-transform: none; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .status { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 30px; }
        .filtro-info { font-size: 0.8rem; color: var(--highlight); margin-bottom: 10px; text-align: center; font-weight: 600; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 12px; animation: fadeIn 0.2s ease;
        }
        .rua-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .entregador-item { display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px dashed #2d3b4e; }
        .entregador-item:last-child { border-bottom: none; padding-bottom: 0; }
        .entregador-nome { font-weight: 700; font-size: 0.95rem; color: var(--text); display: flex; align-items: center; gap: 6px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--accent); font-size: 0.8rem; padding: 3px 8px; border-radius: 6px; margin-top: 4px; display: inline-block; width: fit-content; font-weight: 600; }

        /* Fila de Bipagem */
        .fila-section-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 700;
            margin: 12px 0 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fila-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.18s ease;
        }
        .fila-card.aguardando {
            border-left: 4px solid var(--primary);
        }
        .fila-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .fila-pos {
            background: rgba(59, 130, 246, 0.16);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.84rem;
            padding: 4px 9px;
            border-radius: 7px;
            flex-shrink: 0;
        }
        .fila-nome {
            font-size: 0.96rem;
            font-weight: 700;
            color: var(--text);
            word-break: break-word;
        }
        .fila-tag-aguardando {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.14);
            padding: 3px 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .fila-card.bipado {
            background: rgba(15, 23, 42, 0.55);
            border-color: #263244;
            opacity: 0.52;
        }
        .fila-card.bipado .fila-pos {
            background: rgba(148, 163, 184, 0.12);
            color: var(--muted);
        }
        .fila-card.bipado .fila-nome {
            color: var(--muted);
            text-decoration: line-through;
            font-weight: 600;
        }
        .fila-status-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            margin-left: 6px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="tituloHeader">Consulta de Entregadores</h1>
        <p id="subtituloHeader">Digite a rua ou rua + número (ex: Rua das Flores 250)</p>
    </header>

    <!-- Barra de Abas -->
    <div class="tabs">
        <button class="tab-btn ativa" id="btnTabConsulta" onclick="trocarAba('consulta')">
            🔍 Consulta Endereços
        </button>
        <button class="tab-btn" id="btnTabFila" onclick="trocarAba('fila')">
            📋 Fila Bipagem <span class="tab-badge" id="badgeFilaMotoristas">0</span>
        </button>
    </div>

    <!-- ABA 1: CONSULTA DE ENDEREÇOS -->
    <div id="abaConsulta" class="tab-content ativa">
        <div class="search-box">
            <input type="text" id="campoBusca" placeholder="Ex: Rua das Flores 250 ou Av. Brasil..." autocomplete="off">
        </div>

        <div id="resultados">
            <div class="status">Conectando ao banco de dados...</div>
        </div>
    </div>

    <!-- ABA 2: FILA DE BIPAGEM -->
    <div id="abaFila" class="tab-content">
        <div id="conteudoFilaMotoristas">
            <div class="status">Carregando fila de bipagem...</div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC1hLk6k1E138ffdJT9oMBgRh6di4PR2EY",
        authDomain: "rota-entregadores.firebaseapp.com",
        databaseURL: "https://rota-entregadores-default-rtdb.firebaseio.com",
        projectId: "rota-entregadores",
        storageBucket: "rota-entregadores.firebasestorage.app",
        messagingSenderId: "1094577907467",
        appId: "1:1094577907467:web:8472471b28b1ffa459640e",
        measurementId: "G-V71JKBYEZY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let baseDados = [];
    let filaMotoristas = [];

    function trocarAba(aba) {
        document.getElementById('btnTabConsulta').classList.remove('ativa');
        document.getElementById('btnTabFila').classList.remove('ativa');
        document.getElementById('abaConsulta').classList.remove('ativa');
        document.getElementById('abaFila').classList.remove('ativa');

        if (aba === 'consulta') {
            document.getElementById('btnTabConsulta').classList.add('ativa');
            document.getElementById('abaConsulta').classList.add('ativa');
            document.getElementById('tituloHeader').innerText = "Consulta de Entregadores";
            document.getElementById('subtituloHeader').innerText = "Digite a rua ou rua + número (ex: Rua das Flores 250)";
        } else {
            document.getElementById('btnTabFila').classList.add('ativa');
            document.getElementById('abaFila').classList.add('ativa');
            document.getElementById('tituloHeader').innerText = "Fila de Bipagem";
            document.getElementById('subtituloHeader').innerText = "Acompanhe sua ordem de bipagem";
            renderizarFilaMotoristas();
        }
    }

    function normalizar(texto) {
        return texto ? texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : "";
    }

    // Separa texto da rua e eventual número buscado pelo usuário
    function extrairRuaENumero(entrada) {
        const limpo = normalizar(entrada);
        // Captura número isolado no final ou após vírgula/espaço (ex: "RUA A 120", "RUA A, 120", "RUA A N 120")
        const match = limpo.match(/^(.*?)(?:[\s,]+(?:N[º°O.]*\s*)?(\d+))$/);
        if (match && match[1].trim().length >= 2) {
            return {
                textoRua: match[1].trim(),
                numeroBuscado: parseInt(match[2], 10)
            };
        }
        return {
            textoRua: limpo,
            numeroBuscado: null
        };
    }

    // Verifica se o número buscado pertence à regra cadastrada para o entregador
    function numeroAtendido(regraNumeracao, numeroBuscado) {
        if (numeroBuscado === null) return true;
        const regra = normalizar(regraNumeracao);

        if (!regra || regra.includes("TODA")) return true;

        // Verifica intervalos como "100 AO 500", "100 A 500", "100 - 500", "100 ATE 500"
        const regexFaixa = /(\d+)\s*(?:AO|A|ATE|-)\s*(\d+)/g;
        let m;
        let temFaixa = false;
        while ((m = regexFaixa.exec(regra)) !== null) {
            temFaixa = true;
            const inicio = parseInt(m[1], 10);
            const fim = parseInt(m[2], 10);
            const min = Math.min(inicio, fim);
            const max = Math.max(inicio, fim);
            if (numeroBuscado >= min && numeroBuscado <= max) {
                return true;
            }
        }

        // Se não bateu na faixa, verifica números avulsos listados (ex: "12, 45, 90")
        const semFaixas = regra.replace(/(\d+)\s*(?:AO|A|ATE|-)\s*(\d+)/g, "");
        const avulsos = semFaixas.match(/\d+/g);
        if (avulsos) {
            for (const n of avulsos) {
                if (parseInt(n, 10) === numeroBuscado) return true;
            }
        }

        // Se a regra não continha nenhum número legível (ex: texto livre como "LADO PAR"), mantém visível por segurança
        if (!temFaixa && !avulsos) return true;

        return false;
    }

    db.ref('rotas').on('value', (snapshot) => {
        baseDados = [];
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(id => {
                baseDados.push({ id, ...data[id] });
            });
        }
        filtrarRuas();
    }, () => {
        document.getElementById('resultados').innerHTML = `<div class="status" style="color:#ef4444;">Erro de permissão no Firebase: verifique as Regras do Realtime Database.</div>`;
    });

    db.ref('fila_bipagem').on('value', (snapshot) => {
        filaMotoristas = [];
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(id => {
                filaMotoristas.push({
                    id,
                    motorista: (data[id].motorista || "").toUpperCase().trim(),
                    ordem: Number(data[id].ordem) || 0,
                    bipado: Boolean(data[id].bipado),
                    bipadoEm: Number(data[id].bipadoEm) || 0
                });
            });
        }
        const qtdAguardando = filaMotoristas.filter(f => !f.bipado).length;
        document.getElementById('badgeFilaMotoristas').innerText = qtdAguardando;
        renderizarFilaMotoristas();
    });

    const campoBusca = document.getElementById('campoBusca');
    const divResultados = document.getElementById('resultados');

    campoBusca.addEventListener('input', filtrarRuas);

    function filtrarRuas() {
        const { textoRua, numeroBuscado } = extrairRuaENumero(campoBusca.value);

        if (baseDados.length === 0) {
            divResultados.innerHTML = '<div class="status">Nenhuma rua cadastrada no sistema.</div>';
            return;
        }

        if (textoRua.length < 2) {
            divResultados.innerHTML = '<div class="status">Digite pelo menos 2 letras do nome da rua...</div>';
            return;
        }

        // Primeiro filtra pelo nome da rua
        const porRua = baseDados.filter(item => normalizar(item.rua).includes(textoRua));

        if (porRua.length === 0) {
            divResultados.innerHTML = '<div class="status">Nenhum entregador encontrado para esta rua.</div>';
            return;
        }

        // Depois aplica o filtro inteligente pelo número (se foi digitado)
        let filtrados = porRua.filter(item => numeroAtendido(item.numeracao, numeroBuscado));
        let avisoNumero = '';

        if (numeroBuscado !== null) {
            if (filtrados.length > 0) {
                avisoNumero = `<div class="filtro-info">Filtrando atendimentos para o Nº ${numeroBuscado}</div>`;
            } else {
                // Caso a rua exista mas o número não bata com nenhuma faixa, exibe todos da rua com aviso
                filtrados = porRua;
                avisoNumero = `<div class="filtro-info">Nº ${numeroBuscado} fora das faixas específicas — exibindo todos da rua:</div>`;
            }
        }

        const agrupadoPorRua = {};
        filtrados.forEach(item => {
            const chaveRua = normalizar(item.rua);
            if (!agrupadoPorRua[chaveRua]) {
                agrupadoPorRua[chaveRua] = {
                    nomeExibicao: item.rua.toUpperCase(),
                    entregadores: []
                };
            }
            agrupadoPorRua[chaveRua].entregadores.push({
                nome: item.entregador.toUpperCase(),
                numeracao: (item.numeracao || "TODA A RUA").toUpperCase()
            });
        });

        let html = avisoNumero;
        Object.values(agrupadoPorRua).forEach(grupo => {
            html += `<div class="card">
                        <div class="rua-title">${grupo.nomeExibicao}</div>`;
            
            grupo.entregadores.forEach(ent => {
                html += `<div class="entregador-item">
                            <span class="entregador-nome">🚚 ${ent.nome}</span>
                            <span class="badge">NUMERAÇÃO: ${ent.numeracao}</span>
                         </div>`;
            });

            html += `</div>`;
        });

        divResultados.innerHTML = html;
    }

    function renderizarFilaMotoristas() {
        const container = document.getElementById('conteudoFilaMotoristas');
        if (!container) return;

        const aguardando = filaMotoristas
            .filter(f => !f.bipado)
            .sort((a, b) => a.ordem - b.ordem);

        const bipados = filaMotoristas
            .filter(f => f.bipado)
            .sort((a, b) => a.bipadoEm - b.bipadoEm);

        if (aguardando.length === 0 && bipados.length === 0) {
            container.innerHTML = '<div class="status">Nenhum motorista na fila de bipagem no momento.</div>';
            return;
        }

        let html = '';

        if (aguardando.length > 0) {
            html += `<div class="fila-section-title"><span>Aguardando Bipagem</span><span>${aguardando.length}</span></div>`;
            html += aguardando.map((item, idx) => `
                <div class="fila-card aguardando">
                    <div class="fila-info">
                        <span class="fila-pos">#${idx + 1}</span>
                        <span class="fila-nome">${item.motorista}</span>
                    </div>
                    <span class="fila-tag-aguardando">NA FILA</span>
                </div>
            `).join('');
        } else {
            html += `<div class="status" style="margin-top:16px; margin-bottom:16px;">Nenhum motorista aguardando na fila no momento.</div>`;
        }

        if (bipados.length > 0) {
            html += `<div class="fila-section-title" style="margin-top:20px;"><span>Enviados para Bipagem</span><span>${bipados.length}</span></div>`;
            html += bipados.map(item => `
                <div class="fila-card bipado">
                    <div class="fila-info">
                        <span class="fila-pos">BIP</span>
                        <span class="fila-nome">${item.motorista}<span class="fila-status-tag">(BIPADO)</span></span>
                    </div>
                </div>
            `).join('');
        }

        container.innerHTML = html;
    }
</script>
</body>
</html>
